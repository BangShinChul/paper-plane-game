<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<title>종이비행기 멀리 날리기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* Layout: full-bleed 3D stage; controls sit on it as sheets of graph paper pinned to the bottom edge. Single light look by choice. */
:root {
  color-scheme: light;
  --ink: #17264d; --dim: #5d6b8f; --paper: #fbfcff; --rule: #c9d6f2; --blue: #2456d6; --mark: #ffd84a; --red: #e2463f; --mat: #2f7d6b;
  --hand: "Gaegu", "Nanum Pen Script", cursive; --text: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: #cfe0f7; color: var(--ink); font-family: var(--text); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
#app { position: relative; height: 100%; overflow: hidden; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#steps { position: absolute; top: 8px; left: 0; right: 0; display: flex; gap: 6px; justify-content: center; pointer-events: none; font: 700 18px var(--hand); }
#steps span { background: var(--paper); border: 1.5px solid var(--rule); padding: 1px 10px; color: var(--dim); }
#steps span.on { background: var(--mark); border-color: var(--ink); color: var(--ink); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--paper); border-top: 2px solid var(--ink); padding-block: 10px;
  background-image: linear-gradient(var(--rule) 1px, transparent 1px), linear-gradient(90deg, var(--rule) 1px, transparent 1px); background-size: 16px 16px; }
.sheet .hint { font: 700 18px/1.3 var(--hand); margin: 0 0 8px; background: var(--paper); display: inline-block; padding: 0 4px; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }
.sheet .tog { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: -37px; padding: 5px 10px; font-size: 12px; }
#foldUI.min { padding-block: 4px; } #foldUI.min .hint, #foldUI.min .btns { display: none; }
@media (max-width: 700px) { #foldUI .hint { font-size: 16px; margin-bottom: 6px; } #foldUI .btns { flex-wrap: nowrap; overflow-x: auto; touch-action: pan-x; padding: 0 4px 8px 0; } #foldUI .btns button { flex: none; } }
button { font: 600 13px/1.3 var(--text); color: var(--ink); background: var(--paper); border: 1.5px solid var(--ink); padding: 8px 11px; cursor: pointer; border-radius: 3px; box-shadow: 2px 2px 0 var(--ink); }
button:active { transform: translate(2px, 2px); box-shadow: none; }
button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
button.pri { background: var(--blue); color: #fff; } button.on { background: var(--mark); } button:disabled { opacity: .4; }
#stylePop { position: absolute; left: 0; right: 0; top: 44px; display: flex; justify-content: center; pointer-events: none; }
.pop { pointer-events: auto; background: var(--paper); border: 2px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); padding: 10px 12px; max-width: 440px; width: 100%; display: grid; gap: 8px; }
.prow { display: grid; grid-template-columns: 38px 1fr; gap: 8px; align-items: center; font-size: 13px; } .sw { display: flex; flex-wrap: wrap; gap: 5px; min-width: 0; }
.sw button { width: 30px; height: 30px; padding: 0; border-radius: 50%; box-shadow: none; border: 2px solid var(--ink); } .sw button.txt { width: auto; height: auto; border-radius: 3px; padding: 4px 9px; font-size: 12px; }
.sw button.on { outline: 3px solid var(--blue); outline-offset: 2px; } .sw button.txt.on { background: var(--mark); }
#hangarPop { position: absolute; left: 0; right: 0; top: 44px; bottom: 12px; display: flex; justify-content: center; align-items: flex-start; pointer-events: none; z-index: 5; }
#hangarPop .pop { max-height: 100%; overflow-y: auto; touch-action: pan-y; } #hName { min-width: 0; font: 600 14px var(--text); padding: 7px 9px; border: 1.5px solid var(--ink); border-radius: 3px; background: #fff; color: var(--ink); user-select: text; -webkit-user-select: text; }
#hList { display: grid; gap: 6px; } #hList .it { display: grid; grid-template-columns: 64px 1fr auto; gap: 8px; align-items: center; border: 1.5px solid var(--rule); padding: 4px 6px; background: var(--paper); }
#hList img { width: 64px; height: 48px; object-fit: cover; border: 1px solid var(--rule); display: block; } #hList .nm { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } #hList .dt { font-size: 11px; color: var(--dim); }
#hList .acts { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; } #hList .acts button { padding: 5px 8px; font-size: 12px; box-shadow: 1px 1px 0 var(--ink); } #hList .empty { font-size: 13px; color: var(--dim); padding: 6px 2px; }
#shapeUI { max-height: 46%; overflow-y: auto; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; } .cols > div { min-width: 0; }
@media (max-width: 640px) { .cols { grid-template-columns: 1fr; } }
.sl { display: grid; grid-template-columns: 104px 1fr 52px; gap: 8px; align-items: center; font-size: 13px; background: var(--paper); margin-bottom: 4px; padding: 2px 4px; }
.sl b { font: 700 13px var(--text); text-align: right; font-variant-numeric: tabular-nums; } input[type=range] { width: 100%; accent-color: var(--blue); touch-action: pan-x; }
#stats { background: var(--paper); border: 1.5px solid var(--rule); padding: 8px 10px; font-size: 13px; line-height: 1.7; }
#stats b { color: var(--blue); } #stats .bad { color: var(--red); }
#hud { position: absolute; top: 44px; left: 0; right: 0; text-align: center; pointer-events: none; }
#dist { font: 700 clamp(44px, 12vw, 76px)/1 var(--hand); color: #fff; text-shadow: 0 2px 0 var(--ink), 0 0 12px rgba(23,38,77,.5); font-variant-numeric: tabular-nums; }
#sub { font: 600 13px var(--text); color: #fff; text-shadow: 0 1px 3px var(--ink); font-variant-numeric: tabular-nums; }
#banner { position: absolute; top: 30%; left: 50%; transform: translateX(-50%) rotate(-2deg); background: var(--mark); color: var(--ink); font: 700 26px var(--hand); padding: 4px 18px; border: 2.5px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); pointer-events: none; text-align: center; max-width: 88%;
  background-image: repeating-linear-gradient(-45deg, transparent 0 14px, rgba(23,38,77,.12) 14px 28px); animation: pop .25s ease-out; }
@keyframes pop { from { transform: translateX(-50%) rotate(-2deg) scale(.6); } }
#chips { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-top: 6px; } #chips span { background: var(--red); color: #fff; font: 600 12px var(--text); padding: 2px 9px; border: 1.5px solid var(--ink); border-radius: 12px; }
#alt { position: absolute; left: max(14px, env(safe-area-inset-left, 0px)); top: 28%; height: 36%; width: 14px; border: 2px solid var(--ink); background: rgba(251,252,255,.7); pointer-events: none; display: flex; align-items: flex-end; }
#alt i { display: block; width: 100%; background: var(--blue); } #alt span { position: absolute; top: -22px; left: -4px; font: 600 12px var(--text); color: #fff; text-shadow: 0 1px 3px var(--ink); white-space: nowrap; }
#bDash { position: absolute; right: max(18px, env(safe-area-inset-right, 0px)); bottom: 54px; width: 92px; height: 92px; border-radius: 50%; background: var(--mark); font: 700 26px var(--hand); padding: 0; overflow: hidden; }
#bDash b { position: relative; z-index: 1; font: inherit; } #bDash i { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(23,38,77,.45); }
#bDash.cd { background: var(--paper); }
#stick { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border: 2px solid rgba(255,255,255,.8); border-radius: 50%; background: rgba(23,38,77,.18); pointer-events: none; }
#stick i { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px; border-radius: 50%; background: var(--mark); border: 2px solid var(--ink); }
#wind { display: inline-flex; margin-top: 6px; text-align: left; gap: 8px; align-items: center; background: var(--paper); border: 1.5px solid var(--ink); padding: 4px 10px 4px 6px; font-size: 13px; pointer-events: none; }
#wind .k { display: block; font-size: 11px; color: var(--dim); } #wind b { font-variant-numeric: tabular-nums; }
#vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(12, 24, 56, 0.34) 100%); }
#pop { position: absolute; left: 50%; top: 22%; transform: translate(-50%, 0); font: 700 38px var(--hand); color: #fff; text-shadow: 0 3px 0 var(--ink), 0 0 18px rgba(255, 216, 74, .9); pointer-events: none; white-space: nowrap; opacity: 0; }
#pop.big { font-size: 46px; color: var(--mark); } #pop.go { animation: rise 1.3s ease-out forwards; } #pop.big.go { animation-duration: 2.2s; }
@keyframes rise { 0% { opacity: 0; transform: translate(-50%, 20px) scale(.6); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1.15); } 30% { transform: translate(-50%, 0) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -26px) scale(1); } }
#flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
#splat { position: absolute; inset: 0; pointer-events: none; overflow: hidden; } #splat i { position: absolute; background: radial-gradient(circle at 40% 35%, #fff 0 45%, #e9e6d2 70%, #cfcbb4 100%); box-shadow: 0 6px 0 -2px #d8d4bd; animation: drip 4.2s ease-in forwards; }
@keyframes drip { 0% { transform: scale(.2); opacity: 1; } 8% { transform: scale(1.1); } 12% { transform: scale(1); } 60% { opacity: .95; transform: translateY(30px) scaleY(1.25); } 100% { opacity: 0; transform: translateY(160px) scaleY(1.7); } }
#pow { width: 90px; height: 12px; border: 1.5px solid var(--ink); background: #fff; } #pow i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--mark), var(--red)); }
@media (prefers-reduced-motion: reduce) { #banner, #splat i { animation-duration: .01s; } }
#aim { position: absolute; left: 0; right: 0; bottom: 0; padding-block: 12px; text-align: center; pointer-events: none; }
#aim .hint { font: 700 22px var(--hand); color: #fff; text-shadow: 0 2px 0 var(--ink); margin: 0 0 8px; }
#aim .row { display: inline-flex; flex-wrap: wrap; justify-content: center; gap: 6px 10px; align-items: center; max-width: 100%; box-sizing: border-box; background: var(--paper); border: 1.5px solid var(--ink); padding: 6px 10px; pointer-events: auto; font-size: 13px; }
#aim .row > * { flex: none; white-space: nowrap; } #aim .grp { display: inline-flex; gap: 8px; align-items: center; } #aim input { width: 120px; } #aim .row button { padding: 6px 10px; }
#steer { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font: 700 18px var(--hand); color: #fff; text-shadow: 0 2px 0 var(--ink); pointer-events: none; }
#loupe { position: absolute; top: 44px; left: 12px; width: 136px; height: 136px; border: 2.5px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); pointer-events: none; }
#loupe.r { left: auto; right: 12px; }
#loupe::before, #loupe::after { content: ""; position: absolute; background: var(--red); }
#loupe::before { left: 50%; top: 34%; bottom: 34%; width: 2px; margin-left: -1px; } #loupe::after { top: 50%; left: 34%; right: 34%; height: 2px; margin-top: -1px; }
#loupe span { position: absolute; left: 0; top: 0; background: var(--ink); color: #fff; font: 600 11px var(--text); padding: 1px 6px; }
#c { touch-action: none; }
#toast { position: absolute; top: 44%; left: 50%; transform: translate(-50%, -50%); background: var(--paper); border: 2px solid var(--ink); padding: 4px 14px; font: 700 20px var(--hand); pointer-events: none; text-align: center; max-width: 86%; }
.overlay { position: absolute; inset: 0; display: flex; background: rgba(23, 38, 77, .55); overflow-y: auto; padding-block: 20px; }
.card { background: var(--paper); border: 2px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); padding: 20px; max-width: 460px; width: 100%; margin: auto; }
.card h2 { font: 700 34px/1.1 var(--hand); margin: 0 0 4px; text-wrap: balance; } .card .big { font: 700 64px/1 var(--hand); color: var(--blue); font-variant-numeric: tabular-nums; }
.card p { margin: 6px 0; font-size: 14px; line-height: 1.6; } .card .dim { color: var(--dim); font-size: 13px; }
#lb { list-style: none; margin: 10px 0; padding: 0; border-top: 1.5px solid var(--ink); } #lb li { display: grid; grid-template-columns: 26px 1fr auto auto; gap: 10px; padding: 5px 2px; border-bottom: 1px solid var(--rule); font-size: 14px; font-variant-numeric: tabular-nums; }
#lb li.me { background: var(--mark); } #lb .t { color: var(--dim); }
#nameRow { display: flex; gap: 6px; margin: 10px 0; } #nameRow input { flex: 1; min-width: 0; font: 600 15px var(--text); padding: 7px 9px; border: 1.5px solid var(--ink); border-radius: 3px; background: #fff; color: var(--ink); user-select: text; -webkit-user-select: text; }
</style>

<div id="app">
  <canvas id="c" aria-label="게임 화면"></canvas>
  <div id="steps"><span data-s="fold" class="on">1 접기</span><span data-s="shape">2 모양 잡기</span><span data-s="fly">3 날리기</span></div>

  <div class="sheet gut" id="foldUI">
    <button id="bMin" class="tog" type="button" aria-expanded="true">안내판 접기 ▾</button>
    <p class="hint" id="foldHint">모서리나 종이 위를 잡고 끌면 접힙니다. 두 손가락으로 끌면 종이가 움직이고, 벌리면 확대됩니다.</p>
    <div class="btns">
      <button id="bUndo" type="button">되돌리기</button>
      <button id="bUnfold" type="button">펼치기 (자국 남김)</button>
      <button id="bFlip" type="button">뒤집기</button>
      <button id="bMode" type="button">겹: 잡은 겹만</button>
      <button id="bSnap" type="button" class="on">스냅 켬</button>
      <button id="bHangar" type="button">보관함 (저장·불러오기)</button>
      <button id="bStyle" type="button">종이 꾸미기</button>
      <button id="bRandom" type="button">랜덤 종이</button>
      <button id="bFit" type="button">화면 맞춤</button>
      <button class="bSound" type="button">소리 켬</button>
      <button id="bReset" type="button">새 종이</button>
      <button id="bDart" type="button">예시: 다트</button>
      <button id="bGlider" type="button">예시: 글라이더</button>
      <button id="bToShape" type="button" class="pri">다음: 모양 잡기</button>
    </div>
  </div>

  <div id="hangarPop" class="gut" hidden>
    <div class="pop">
      <div class="prow" style="grid-template-columns: 1fr auto"><input id="hName" maxlength="14" placeholder="비행기 이름" aria-label="저장할 비행기 이름"><button id="bSavePlane" type="button" class="pri">지금 비행기 저장</button></div>
      <div id="hList"></div>
      <div class="btns"><button id="bHangarClose" type="button">닫기</button></div>
    </div>
  </div>

  <div id="stylePop" class="gut" hidden>
    <div class="pop">
      <div class="prow"><span>앞면</span><div class="sw" id="swF"></div></div>
      <div class="prow"><span>뒷면</span><div class="sw" id="swB"></div></div>
      <div class="prow"><span>무늬</span><div class="sw" id="swP"></div></div>
      <div class="btns"><button id="bRandom2" type="button">랜덤</button><button id="bSwap" type="button">앞뒤 바꾸기</button><button id="bStyleClose" type="button" class="pri">완료</button></div>
    </div>
  </div>

  <div class="sheet gut" id="shapeUI" hidden>
    <p class="hint">접은 곳을 얼마나 세울지 정하고, 비행기를 눌러 잡을 곳을 찍으세요. 끌면 돌려 볼 수 있어요.</p>
    <div class="cols">
      <div>
        <div id="angles"></div>
        <div class="sl"><span>왼쪽 뒤끝 휘기</span><input id="bendL" type="range" min="-100" max="100" step="5" value="30" aria-label="왼쪽 날개 뒤끝 휘기"><b id="bendLV">위 30</b></div>
        <div class="sl"><span>오른쪽 뒤끝 휘기</span><input id="bendR" type="range" min="-100" max="100" step="5" value="30" aria-label="오른쪽 날개 뒤끝 휘기"><b id="bendRV">위 30</b></div>
      </div>
      <div>
        <div id="stats"></div>
        <div class="btns" style="margin-top:8px">
          <button id="bWings" type="button">날개 자동 펴기</button>
          <button id="bTrim" type="button">뒤끝 자동 맞춤</button>
          <button id="bFwd" type="button">앞 방향 돌리기</button>
          <button id="bUp" type="button">위아래 바꾸기</button>
          <button id="bHangar2" type="button">보관함에 저장</button>
          <button id="bBack" type="button">다시 접기</button>
          <button id="bToFly" type="button" class="pri">날리러 가기</button>
        </div>
      </div>
    </div>
  </div>

  <div id="hud" hidden><div id="dist">0.0 m</div><div id="sub"></div><div id="wind" hidden><svg id="windArrow" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M12 2 L19 12 H14.5 V22 H9.5 V12 H5 Z" fill="#2456d6" stroke="#17264d" stroke-width="1.5" stroke-linejoin="round"/></svg><div><span class="k">바람 · 위쪽이 앞</span><span id="windTxt"></span></div></div><div id="chips"></div></div>
  <div id="alt" hidden><i id="altFill"></i><span>높이</span></div>
  <div id="vig" hidden></div><div id="flash"></div><div id="splat"></div><div id="pop" hidden></div>
  <div id="banner" hidden></div>
  <div id="aim" class="gut" hidden>
    <p class="hint">아래로 당겼다가 위로 빠르게 밀어 던지세요</p>
    <div class="row"><span class="grp"><label for="ang">던지는 각도</label><input id="ang" type="range" min="-5" max="40" value="10"><b id="angV">10°</b></span><span class="grp"><span>당김</span><div id="pow"><i id="powFill"></i></div></span><span class="grp"><button class="bSound" type="button">소리 켬</button><button id="bRefold" type="button">다시 접기</button></span></div>
  </div>
  <div id="steer" hidden>화면을 누른 채 끌면 좌우로, 아래로 끌면 내려가요</div>
  <button id="bDash" type="button" hidden><b>회피</b><i id="dashFill"></i></button>
  <div id="stick" hidden><i></i></div>
  <div id="toast" hidden></div>
  <div id="loupe" hidden><span>확대</span></div>

  <div class="overlay gut" id="result" hidden>
    <div class="card">
      <h2 id="rTitle">착륙!</h2>
      <div class="big" id="rDist">0.0 m</div>
      <p id="rInfo"></p>
      <div id="nameRow"><input id="pname" maxlength="12" value="플레이어" aria-label="이름"><button id="bSave" type="button" class="pri">기록 저장</button></div>
      <ol id="lb"></ol>
      <p class="dim">기록은 이 브라우저에만 저장됩니다.</p>
      <div class="btns"><button id="bAgain" type="button" class="pri">같은 비행기로 다시</button><button id="bNew" type="button">다시 접기</button></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const T = THREE, $ = id => document.getElementById(id), V3 = (x, y, z) => new T.Vector3(x, y, z);

/* ================= origami engine (flat folds + per-fold dihedral angle) ================= */
// affine [a,b,c,d,e,f]: x' = a x + c y + e, y' = b x + d y + f
const ap = (m, p) => [m[0] * p[0] + m[2] * p[1] + m[4], m[1] * p[0] + m[3] * p[1] + m[5]];
const mul = (A, B) => [A[0] * B[0] + A[2] * B[1], A[1] * B[0] + A[3] * B[1], A[0] * B[2] + A[2] * B[3], A[1] * B[2] + A[3] * B[3], A[0] * B[4] + A[2] * B[5] + A[4], A[1] * B[4] + A[3] * B[5] + A[5]];
const inv = m => { const d = m[0] * m[3] - m[1] * m[2]; return [m[3] / d, -m[1] / d, -m[2] / d, m[0] / d, (m[2] * m[5] - m[3] * m[4]) / d, (m[1] * m[4] - m[0] * m[5]) / d]; };
